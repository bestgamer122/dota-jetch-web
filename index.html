<script>
/* Диагностика: покажет в консоли, если какой-то скрипт не загрузился */
window.addEventListener("load", function () {
  var missing = [];
  if (typeof Store === "undefined")             missing.push("config.js");
  if (typeof UI === "undefined")                missing.push("ui.js");
  if (typeof getHeroes !== "function")          missing.push("heroes.js");
  if (typeof kbAnswer !== "function")           missing.push("knowledge.js");
  if (typeof Achievements === "undefined")      missing.push("achievements.js");
  if (typeof History === "undefined")           missing.push("history.js");
  if (typeof Diary === "undefined")             missing.push("diary.js");
  if (typeof renderChat !== "function")         missing.push("assistant.js");
  if (typeof renderGames !== "function")        missing.push("games.js");
  if (typeof Charts === "undefined")            missing.push("charts.js");
  if (typeof Daily === "undefined")             missing.push("daily.js");
  if (typeof Exporter === "undefined")          missing.push("export.js");
  if (typeof renderAnalyze !== "function")      missing.push("analyze.js");
  if (typeof switchPage !== "function")         missing.push("app.js");
  if (missing.length) {
    console.error("⚠️ DOTA JETCH — не загрузились скрипты:", missing.join(", "));
    console.error("Проверь вкладку Network (F12), что эти файлы отдаются с кодом 200.");
  } else {
    console.log("✓ DOTA JETCH — все 15 скриптов загружены");
  }
});
</script>
