/* ─── ЗАГРУЗОЧНЫЙ ЭКРАН ─── */
#splashScreen {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: radial-gradient(circle at 50% 40%, #1a1030 0%, #0b0c10 60%, #04050a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
#splashScreen.splash-hide {
  opacity: 0;
  pointer-events: none;
}

.splash-card {
  text-align: center;
  padding: 40px 60px;
  animation: splashCardIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes splashCardIn {
  0% { opacity: 0; transform: scale(0.8) translateY(30px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.splash-logo {
  width: 100px;
  height: 100px;
  margin: 0 auto 24px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash-logo::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 70%);
  animation: splashGlow 2.5s ease-in-out infinite;
}

.splash-logo::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: #8b5cf6;
  border-right-color: #22d3ee;
  animation: splashSpin 1.4s linear infinite;
}

@keyframes splashGlow {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.25); opacity: 1; }
}

@keyframes splashSpin {
  to { transform: rotate(360deg); }
}

.splash-logo svg {
  width: 64px;
  height: 64px;
  color: #c4b5fd;
  filter: drop-shadow(0 0 16px rgba(196, 181, 253, 0.9));
  animation: splashLogoPulse 2s ease-in-out infinite;
  position: relative;
  z-index: 1;
}

@keyframes splashLogoPulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.1) rotate(180deg); }
}

.splash-title {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 0.08em;
  background: linear-gradient(120deg, #ffffff 0%, #c4b5fd 45%, #67e8f9 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: splashTitleShift 3s ease-in-out infinite;
  margin-bottom: 8px;
}

@keyframes splashTitleShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.splash-sub {
  font-size: 13px;
  color: #8b93a8;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin-bottom: 40px;
  animation: splashSubIn 0.7s ease-out 0.3s both;
}

@keyframes splashSubIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.splash-bar {
  width: 280px;
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  margin: 0 auto 18px;
  overflow: hidden;
  position: relative;
}

.splash-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #8b5cf6, #22d3ee, #a78bfa);
  background-size: 200% 100%;
  border-radius: 2px;
  animation: splashBarFill 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
             splashBarShift 1.2s linear infinite;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
}

@keyframes splashBarFill {
  0% { width: 0%; }
  40% { width: 55%; }
  70% { width: 78%; }
  100% { width: 100%; }
}

@keyframes splashBarShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.splash-status {
  font-size: 11px;
  color: #6b7280;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.08em;
  min-height: 18px;
  animation: splashStatusPulse 1.5s ease-in-out infinite;
}

@keyframes splashStatusPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
</style>

<!-- ═══════════ СКРИПТЫ ═══════════ -->
<script>
/* Управление загрузочным экраном */
(function() {
  var statuses = [
    "Инициализация...",
    "Загрузка модулей...",
    "Подключение к Firebase...",
    "Загрузка данных...",
    "Почти готово..."
  ];
  var idx = 0;
  var el = document.getElementById("splashStatus");
  var interval = setInterval(function() {
    idx = (idx + 1) % statuses.length;
    if (el) el.textContent = statuses[idx];
  }, 480);

  function hideSplash() {
    clearInterval(interval);
    var splash = document.getElementById("splashScreen");
    if (!splash) return;
    splash.classList.add("splash-hide");
    setTimeout(function() { splash.remove(); }, 750);
  }

  /* Скрываем через 2.4 секунды */
  setTimeout(hideSplash, 2400);

  /* На случай, если страница уже загружена */
  if (document.readyState === "complete") {
    /* Ничего не делаем — таймер выше сработает */
  }
})();
</script>
