<script src="js/visual.js?v=3.3.8"></script>

<script>
window.addEventListener("load", function () {
  var missing = [];
  if (typeof Store === "undefined")             missing.push("config.js");
  if (typeof UI === "undefined")                missing.push("ui.js");
  if (typeof getHeroes !== "function")          missing.push("fallback.js");
  if (typeof kbAnswer !== "function")           missing.push("knowledge.js");
  if (typeof Achievements === "undefined")      missing.push("achievements.js");
  if (typeof History === "undefined")           missing.push("history.js");
  if (typeof Diary === "undefined")             missing.push("diary.js");
  if (typeof renderChat !== "function")         missing.push("assistant.js");
  if (typeof renderGames !== "function")        missing.push("games.js");
  if (typeof Charts === "undefined")            missing.push("charts.js");
  if (typeof Daily === "undefined")             missing.push("daily.js");
  if (typeof Exporter === "undefined")          missing.push("export.js");
  if (typeof renderAnalyze !== "function")      missing.push("analyze.js");
  if (typeof switchPage !== "function")         missing.push("app.js");
  if (missing.length) {
    console.warn("⚠️ DOTA JETCH — не загрузились скрипты:", missing.join(", "));
    var el = document.getElementById("pageContent");
    if (el && !el.innerHTML.trim()) {
      el.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;font-family:monospace;">' +
        '<div style="font-size:32px;margin-bottom:16px;">⚠️</div>' +
        '<div style="font-size:16px;font-weight:bold;margin-bottom:8px;">Не загрузились файлы:</div>' +
        '<div style="font-size:13px;color:#9ba0ad;">' + missing.join(", ") + '</div>' +
        '<div style="font-size:11px;color:#6b7280;margin-top:20px;">F12 → Network → проверь статус этих файлов (200 = ок, 404 = не залит)</div>' +
        '</div>';
    }
  } else if (!document.getElementById("pageContent") || !document.getElementById("pageContent").innerHTML.trim()) {
    var el2 = document.getElementById("pageContent");
    if (el2) {
      el2.innerHTML = '<div style="padding:40px;text-align:center;color:#fbbf24;font-family:monospace;">' +
        '<div style="font-size:32px;margin-bottom:16px;">⚠️</div>' +
        '<div style="font-size:16px;font-weight:bold;margin-bottom:8px;">Скрипты загружены, но init() не сработал</div>' +
        '<div style="font-size:13px;color:#9ba0ad;">Проверь консоль (F12) — там должна быть причина.</div>' +
        '</div>';
    }
  } else {
    console.log("✓ DOTA JETCH — все скрипты загружены");
  }
});
</script>
