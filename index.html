<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOTA JETCH</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0b'/%3E%3Cpath fill='%237c5cff' d='M16 5 L19.2 12.8 L27 16 L19.2 19.2 L16 27 L12.8 19.2 L5 16 L12.8 12.8 Z'/%3E%3C/svg%3E">
<meta name="theme-color" content="#7c5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Анализ матчей, дневник и мини-игры для Dota 2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=137.0">
<link rel="stylesheet" href="css/lite.css?v=137.0">
</head>
<body>

<div class="bg-fx" aria-hidden="true">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="bg-stars bg-stars-1"></div>
  <div class="bg-stars bg-stars-2"></div>
  <div class="bg-twinkle"></div>
</div>

<div id="splashScreen">
  <div class="splash-halo" aria-hidden="true"></div>
  <div class="splash-grid" aria-hidden="true"></div>
  <div class="splash-inner">
    <div class="splash-mark-wrap">
      <span class="splash-ring" aria-hidden="true"></span>
      <span class="splash-ring" aria-hidden="true"></span>
      <div class="splash-mark">
        <span class="splash-mark-glow" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z"/></svg>
      </div>
    </div>
    <div class="splash-wordmark">DOTA <span>JETCH</span></div>
    <div class="splash-rule" aria-hidden="true"></div>
    <div class="splash-tagline">Аналитика матчей · Дневник · Мини-игры</div>
    <div class="splash-track" role="progressbar" aria-label="Загрузка"><span></span></div>
    <div class="splash-status">
      <span class="splash-dot" aria-hidden="true"></span>
      <span id="splashStatus">Инициализация</span>
    </div>
  </div>
</div>

<div id="authScreen"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">DOTA JETCH</span>
        <span class="brand-sub">Tracker</span>
      </span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav" aria-label="Основная навигация"></nav>
    <div class="sidebar-foot">
      <div class="plan" id="planCard">
        <div class="plan-head">
          <span class="plan-title" id="planTitle">FREE</span>
          <span class="plan-value" id="planValue">5 / 5</span>
        </div>
        <div class="plan-info" id="planInfo">5 анализов в день</div>
        <div class="plan-bar"><div class="plan-bar-fill" style="width:0%"></div></div>
      </div>
      <button type="button" id="sidebarUserBlock" onclick="openProfileModal()" title="Открыть профиль">
        <span id="sidebarAvatar" class="avatar">?</span>
        <span class="user-meta">
          <span class="user-nick-row">
            <span id="userNick" class="user-nick">—</span>
            <span id="sidebarUserBadge" class="user-badge free" style="display:none;">FREE</span>
          </span>
          <span id="userEmailSmall" class="user-email">—</span>
        </span>
        <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">Главная</div>
      <div class="topbar-actions">
        <button type="button" class="search-trigger" id="paletteTrigger" aria-label="Быстрый переход">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Поиск</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="sync-pill" id="syncPill" data-state="offline" title="Статус синхронизации">
          <span class="sync-dot"></span><span id="syncLabel">Офлайн</span>
        </span>
      </div>
    </header>
    <div class="page-scroll"><div id="pageContent" class="page-content"></div></div>
  </main>
</div>

<div id="paletteOverlay" class="palette-overlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Быстрый переход">
    <div class="palette-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="paletteInput" class="palette-input" type="text" placeholder="Перейти к странице или выполнить действие…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div id="paletteList" class="palette-list" role="listbox" aria-label="Результаты"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> навигация</span>
      <span><kbd>↵</kbd> открыть</span>
    </div>
  </div>
</div>

<div id="profileModalOverlay">
  <div class="profile-modal">
    <button class="profile-modal-close" type="button" onclick="closeProfileModal()" aria-label="Закрыть">✕</button>
    <div class="profile-avatar-wrap">
      <div id="profileAvatarBig" class="profile-avatar-big" onclick="triggerAvatarUpload()" title="Сменить аватар">?</div>
      <button id="profileResetAvatarBtn" class="profile-avatar-reset" type="button" title="Убрать аватар">✕</button>
      <div class="profile-avatar-hint">Нажми, чтобы сменить</div>
    </div>
    <div class="profile-nick-row">
      <div id="profileModalNick" class="profile-modal-nick">—</div>
      <span id="profileModalBadge" class="user-badge free" style="display:none;">FREE</span>
    </div>
    <div id="profileModalEmail" class="profile-modal-email">—</div>
    <div id="profileModalStats" class="profile-modal-stats"></div>
    <div id="profileNickSection"></div>
    <button id="profileLogoutBtn" class="btn btn-danger btn-block" type="button">Выйти из аккаунта</button>
  </div>
</div>

<input type="file" id="avatarFileInput" accept="image/*" style="display:none;">

<script>
(function () {
  var statuses = ["Инициализация", "Загрузка модулей", "Подключение к Firebase", "Загрузка данных", "Почти готово"];
  var idx = 0;
  var statusEl = document.getElementById("splashStatus");
  var interval = setInterval(function () {
    if (!statusEl) return;
    idx = (idx + 1) % statuses.length;
    statusEl.textContent = statuses[idx];
  }, 620);
  function hideSplash() {
    clearInterval(interval);
    var splash = document.getElementById("splashScreen");
    if (!splash) return;
    splash.classList.add("splash-hide");
    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
  }
  setTimeout(hideSplash, 2200);
})();
</script>

<script src="js/firebase-config.js?v=137.0"></script>
<script src="js/config.js?v=137.0"></script>
<script src="js/sync.js?v=137.0"></script>
<script type="module" src="js/auth.js?v=137.0"></script>
<script src="js/fallback.js?v=137.0"></script>
<script src="js/ui.js?v=137.0"></script>
<script src="js/knowledge.js?v=137.0"></script>
<script src="js/admin-panel.js?v=137.0"></script>
<script src="js/achievements.js?v=137.0"></script>
<script src="js/history.js?v=137.0"></script>
<script src="js/diary.js?v=137.0"></script>
<script src="js/rating.js?v=137.0"></script>
<script src="js/sound.js?v=137.0"></script>
<script type="module" src="js/leaderboard.js?v=137.0"></script>
<script src="js/games.js?v=137.0"></script>
<script src="js/charts.js?v=137.0"></script>
<script src="js/daily.js?v=137.0"></script>
<script src="js/analyze.js?v=137.0"></script>
<script src="js/settings.js?v=137.0"></script>
<script src="js/profile-analyzer.js?v=137.0"></script>
<script src="js/app.js?v=137.0"></script>
<script src="js/visual.js?v=137.0"></script>
</body>
</html>
