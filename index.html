<style>
#authScreen { position: fixed; inset: 0; z-index: 99999; background: var(--bg-base, #0b0c10); display: none; align-items: center; justify-content: center; padding: 20px; }
#authScreen .auth-card { max-width: 420px; width: 100%; background: var(--bg-card, #15161b); border: 1px solid var(--border, #2a2b33); border-radius: 16px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
#authScreen .auth-logo { text-align: center; margin-bottom: 24px; }
#authScreen .auth-logo svg { width: 48px; height: 48px; color: #8b5cf6; margin-bottom: 12px; }
#authScreen h1 { font-size: 20px; font-weight: 800; color: var(--text, #fff); margin: 0 0 6px; text-align: center; }
#authScreen .auth-sub { font-size: 12px; color: var(--text-dim, #888); text-align: center; margin-bottom: 22px; line-height: 1.5; }
#authScreen input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elev, #1c1d24); border: 1px solid var(--border, #2a2b33); border-radius: 10px; color: var(--text, #fff); font-size: 14px; font-family: inherit; }
#authScreen input:focus { outline: none; border-color: #8b5cf6; }
#authScreen .auth-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
#authScreen .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#authScreen .auth-btn-primary { background: #8b5cf6; color: #fff; margin-bottom: 10px; }
#authScreen .auth-btn-outline { background: transparent; color: #8b5cf6; border: 1px solid #8b5cf6; }
#authScreen .auth-error { color: #ef4444; font-size: 12px; min-height: 16px; margin-bottom: 8px; text-align: center; }
#authScreen .auth-hint { font-size: 11px; color: var(--text-dim, #666); text-align: center; margin-top: 18px; }
#authScreen .auth-forgot { text-align: center; margin-top: 14px; }
#authScreen .auth-forgot a { font-size: 12px; color: #8b5cf6; text-decoration: none; }
</style>
</head>
<body>

<div id="authScreen"></div>
<div class="bg-base"></div>
<div class="bg-aurora"></div>
<div class="bg-orbs"><span></span><span></span><span></span></div>

<div class="bg-vignette"></div>

<div class="app">
  <header class="titlebar">
    <span class="titlebar-icon"><svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z"/></svg></span>
    <span class="titlebar-title">DOTA JETCH AI 2.0</span>
    <span class="titlebar-spacer"></span>
    <span class="titlebar-status">Готов</span>
    <span class="status-dot"></span>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark"><svg viewBox="0 0 24 24" fill="none" width="20" height="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z"/></svg></div>
        <div><div class="sidebar-logo-title">DOTA JETCH</div><div class="sidebar-logo-sub">AI 2.0</div></div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-plan">
        <div class="plan-title" id="planTitle">FREE</div>
        <div class="plan-info" id="planInfo">5 анализов в день</div>
        <div class="plan-value" id="planValue">5 / 5</div>
        <div class="plan-bar"><div class="plan-bar-fill" style="width:100%"></div></div>
      </div>
      <div style="margin-top:12px;padding:0 14px 14px;">
        <div id="userEmail" style="font-size:10px;color:var(--text-dim);text-align:center;margin-bottom:6px;word-break:break-all;"></div>
        <button id="logoutBtn" style="width:100%;padding:8px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:11px;cursor:pointer;font-family:inherit;display:none;">Выйти</button>
      </div>
    </aside>
    <main class="main">
      <div class="page-header"><div class="page-title" id="pageTitle">Главная</div></div>
      <div class="page-scroll"><div id="pageContent" class="page-content"></div></div>
    </main>
  </div>
